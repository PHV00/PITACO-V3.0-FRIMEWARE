name: PITACO firmware — testes, build e qualidade de código
on:
  push:
    branches: [main, fix/pitaco24-layout-imports-ci]
  workflow_dispatch:
  pull_request:
    paths:
      - 'frimeware2.4/**'
      - 'arduino-pitaco-mpx5010dp-ble/**'
      - 'arduino-pitaco-ble-legancy/**'
      - 'test/**'
      - 'docs/**'
      - 'requirements.txt'
      - '.github/workflows/pitaco24-g1.yml'
      - '.github/workflows/firmware-static-analysis.yml'
      - 'scripts/firmware_quality_report.py'

jobs:
  host:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: arduino-pitaco-mpx5010dp-ble
    steps:
      - uses: actions/checkout@v4
      - name: Gate 01 C++ com o mesmo modulo do firmware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror test/test_sqi_gate1.cpp -o /tmp/pitaco_g1
          /tmp/pitaco_g1
      - name: Testes host de BLE/USB, G1, PPG e GUI
        run: |
          python3 -m unittest discover -s test -p 'test_*.py'
      - name: Imports, sintaxe e entradas de ferramentas
        run: |
          python3 -m py_compile arduino-pitaco-mpx5010dp-ble/ble_client_mpx5010dp.py
          python3 -m compileall -q arduino-pitaco-mpx5010dp-ble/pitaco_bridge
          python3 -m compileall -q arduino-pitaco-mpx5010dp-ble/pitaco_experimental
          python3 arduino-pitaco-mpx5010dp-ble/pitaco_experimental/pitaco24_ppg_probe.py --help
          python3 arduino-pitaco-mpx5010dp-ble/pitaco_experimental/analyze_ppg_25hz.py --help

  esp32c3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar ESP32 e biblioteca de compatibilidade
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.9 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "SparkFun MAX3010x Pulse and Proximity Sensor Library"
      - name: Compilar firmware canonico 2.4 para ESP32-C3
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 frimeware2.4
      - name: Compilar firmware legado ESP32
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 arduino-pitaco-ble-legancy

  static-analysis:
    name: Cppcheck + Clang-Tidy (scoped)
    uses: ./.github/workflows/firmware-static-analysis.yml
    permissions:
      contents: read

  quality-gate:
    name: PITACO firmware quality gate
    if: always()
    needs: [host, esp32c3, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate mandatory test, build and analysis results
        shell: bash
        env:
          HOST_RESULT: ${{ needs.host.result }}
          ESP32_RESULT: ${{ needs.esp32c3.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
        run: |
          {
            echo '## PITACO firmware — final quality gate'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Host G1 + Python/USB/BLE | ${HOST_RESULT} |"
            echo "| ESP32-C3 and legacy ESP32 compilation | ${ESP32_RESULT} |"
            echo "| Cppcheck/Clang-Tidy verified reports | ${STATIC_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${HOST_RESULT}" != success || "${ESP32_RESULT}" != success || "${STATIC_RESULT}" != success ]]; then
            echo '::error::PITACO quality gate failed: check host, ESP32 and static-analysis jobs.'
            exit 1
          fi
          echo 'All mandatory checks passed.'
