name: PITACO 2.4 MAX30105 host tests
on:
  push:
    branches: [feature/pitaco-24-max30105-g1]
  pull_request:
    paths:
      - 'arduino-pitaco-mpx5010dp-unity/sqi_gate1.*'
      - 'arduino-pitaco-mpx5010dp-unity/ppg_max30105.*'
      - 'arduino-pitaco-mpx5010dp-unity/tests/**'
      - 'arduino-pitaco-mpx5010dp-unity/pitaco24_ppg_probe.py'
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ G1
        run: |
          cd arduino-pitaco-mpx5010dp-unity
          g++ -std=c++11 -Wall -Wextra -Werror -I. sqi_gate1.cpp tests/test_sqi_gate1.cpp -o /tmp/pitaco_g1
          /tmp/pitaco_g1
      - name: USB parser
        run: |
          cd arduino-pitaco-mpx5010dp-unity
          python3 -m unittest discover -s tests -p 'test_*.py'
