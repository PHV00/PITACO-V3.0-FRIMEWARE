name: PITACO firmware - static analysis (Cppcheck / Clang-Tidy)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Arduino C++ - scoped static quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_DIR: ${{ github.workspace }}/.pitaco-static-esp32c3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.9 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "SparkFun MAX3010x Pulse and Proximity Sensor Library"
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          mkdir -p reports

      - name: Compile canonical ESP32-C3 sketch and generate compilation database
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-path "$BUILD_DIR" frimeware2.4
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --build-path "$BUILD_DIR" --only-compilation-database frimeware2.4

      - name: Verify sketch is included in compilation database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ["BUILD_DIR"])
          database = build / "compile_commands.json"
          if not database.is_file():
              raise SystemExit("ERROR: Arduino compilation database was not generated")
          commands = json.loads(database.read_text(encoding="utf-8"))
          sketches = [Path(row["file"]) for row in commands
                      if Path(row["file"]).name == "frimeware2.4.ino.cpp"]
          if len(sketches) != 1:
              raise SystemExit(f"ERROR: expected one compiled sketch, found {len(sketches)}")
          sketch = sketches[0]
          if not sketch.is_file():
              raise SystemExit(f"ERROR: generated C++ file missing: {sketch}")
          text = sketch.read_text(encoding="utf-8", errors="replace")
          if "g1Evaluate" not in text or "PollMAX30105" not in text:
              raise SystemExit("ERROR: sketch does not contain expected firmware entrypoints")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SKETCH_CPP={sketch}\n")
          Path("reports/coverage-manifest.txt").write_text(
              f"Source: {sketch}\nDatabase: {database}\n"
              "Scope: compiled PITACO sketch (C++ translation unit); vendor libraries "
              "are dependencies, not individually quality-gated.\n",
              encoding="utf-8"
          )
          print("Verified canonical generated sketch:", sketch)
          PY

      # Raw analyzers return different codes for findings versus technical failures.
      # Record both codes so the report step can distinguish them and fail closed.
      - name: Cppcheck on compiled sketch and dependencies
        shell: bash
        run: |
          set +e
          cppcheck --version | tee reports/cppcheck-version.txt
          cppcheck --project="$BUILD_DIR/compile_commands.json" \
            --file-filter='*frimeware2.4.ino.cpp' \
            --enable=warning,performance,portability,style \
            --inconclusive --suppress=missingIncludeSystem \
            --xml --xml-version=2 --error-exitcode=2 \
            2>reports/cppcheck.xml
          code=$?
          printf '%s\n' "$code" > reports/cppcheck-exit-code.txt
          echo "Cppcheck completed with exit code $code; parsed by quality reporter."

      - name: Clang-Tidy for real G1 module through host test
        shell: bash
        run: |
          set +e
          clang-tidy --version | tee reports/clang-tidy-version.txt
          # The ESP32 Arduino compilation database has GCC-only flags and missing
          # cross stdlib paths for Clang. The same production G1 module is included
          # by this native-host test, so this check is reliable but scoped to G1.
          clang-tidy test/test_sqi_gate1.cpp \
            -checks='-*,clang-analyzer-*,bugprone-*' \
            --quiet -- -std=c++11 -Ifrimeware2.4 \
            >reports/clang-tidy.txt 2>&1
          code=$?
          printf '%s\n' "$code" > reports/clang-tidy-exit-code.txt
          echo "Clang-Tidy (host G1) completed with exit code $code."

      - name: Raw analyzer outputs (expand logs)
        if: always()
        shell: bash
        run: |
          echo '::group::CPPCheck — raw XML output'
          if [[ -f reports/cppcheck.xml ]]; then
            cat reports/cppcheck.xml
          else
            echo '[No Cppcheck XML output]'
          fi
          echo '::endgroup::'
          echo '::group::Clang-Tidy — raw diagnostic output'
          if [[ -f reports/clang-tidy.txt ]]; then
            cat reports/clang-tidy.txt
          else
            echo '[No Clang-Tidy raw output]'
          fi
          echo '::endgroup::'

      - name: Render report and enforce first-party quality gate
        if: always()
        shell: bash
        run: |
          python3 scripts/firmware_quality_report.py \
            --reports reports --workspace "$GITHUB_WORKSPACE"

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitaco-esp32c3-static-analysis
          path: reports/
          if-no-files-found: warn
          retention-days: 30
